services:
  - type: web
    name: dse-physics-initial
    runtime: docker
    region: singapore
    plan: starter
    healthCheckPath: /healthz
    autoDeployTrigger: off
    disk:
      name: student-data
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: NODE_ENV
        value: production
      - key: DSE_DATA_DIR
        value: /var/data
      - key: DSE_MAINTENANCE
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
